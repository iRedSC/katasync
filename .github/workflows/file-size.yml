# The pre-commit hook can be skipped with --no-verify; this can't. Same
# checks, file sizes over every tracked file. They need no dependencies, so
# this skips pnpm install.
name: File size

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-file-size.ts --all
      # A branch merged after a newer one leaves its migration dated too early.
      - run: node scripts/check-migrations.ts
