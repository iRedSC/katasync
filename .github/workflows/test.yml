# Lint, types and tests on every PR, so a change that breaks one can't merge
# looking green. Tests run against PGlite in memory (src/test/db.ts), so they
# need no database or secrets.
name: Test

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR replaces the run; runs on main all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
